name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Copier three.js dans l'APK (3D sans Internet)
        run: |
          mkdir -p app/src/main/assets/js
          curl -fsSL -o app/src/main/assets/js/three.min.js https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js
          curl -fsSL -o app/src/main/assets/js/OrbitControls.js https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js
      - name: Compiler l'APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: TP-THERMO_2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
